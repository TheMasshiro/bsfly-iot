name: Build Android

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Install app dependencies
        working-directory: ./bsfly-iot
        run: npm install --ci

      - name: Build web assets
        working-directory: ./bsfly-iot
        run: npm run build

      - name: Sync to Android
        working-directory: ./bsfly-iot
        run: npx cap sync android

      - name: Build Android Dev APK
        working-directory: ./bsfly-iot/android
        run: ./gradlew assembleDebug

      - name: Build Android Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: ./bsfly-iot/android
        run: ./gradlew assembleRelease

      - name: Build Android App Bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: ./bsfly-iot/android
        run: ./gradlew bundleRelease

      - name: Debug - List APK outputs
        if: always()
        run: |
          echo "=== Checking build outputs ==="
          find bsfly-iot/android/app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
          find bsfly-iot/android/app/build/outputs -type f -name "*.aab" 2>/dev/null || echo "No AAB files found"
          ls -la bsfly-iot/android/app/build/outputs 2>/dev/null || echo "Build outputs directory not found"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bsfly-iot/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload App Bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: bsfly-iot/android/app/build/outputs/bundle/release/
          retention-days: 30
