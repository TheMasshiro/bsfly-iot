name: Build Android

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install global dependencies
        run: |
          npm install -g cordova
          npm install -g @ionic/cli

      - name: Install app dependencies
        working-directory: ./bsfly-iot
        run: npm install --ci

      - name: Add Android platform
        working-directory: ./bsfly-iot
        run: ionic cordova platform add android

      - name: Build Android Dev APK
        working-directory: ./bsfly-iot
        run: ionic cordova build android

      - name: Build Android Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: ./bsfly-iot
        run: ionic cordova build android --release --prod

      - name: Generate Android App Bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: ./bsfly-iot/platforms/android/
        run: ./gradlew bundle

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            bsfly-iot/platforms/android/app/build/outputs/apk/debug/*.apk
            bsfly-iot/platforms/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload App Bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: bsfly-iot/platforms/android/app/build/outputs/bundle/release/
          retention-days: 30
